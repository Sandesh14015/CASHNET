openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: cashnet
    description: CASHNET investigative intelligence operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [cashnet]
      summary: Dashboard intelligence summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /cases:
    get:
      operationId: listCases
      tags: [cashnet]
      summary: List synthetic investigation cases
      responses:
        "200":
          description: Cases
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Case" }
    post:
      operationId: createCase
      tags: [cashnet]
      summary: Create a case from a scam report
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaseInput" }
      responses:
        "201":
          description: Created case
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Case" }
  /cases/{caseId}:
    get:
      operationId: getCase
      tags: [cashnet]
      summary: Get a case and linked intelligence
      parameters:
        - { name: caseId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Case detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseDetail" }
  /cases/{caseId}/analyze:
    post:
      operationId: analyzeCase
      tags: [cashnet]
      summary: Run the complete synthetic analysis pipeline
      parameters:
        - { name: caseId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Analysis result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseDetail" }
  /cases/{caseId}/complaint:
    post:
      operationId: addComplaint
      tags: [cashnet]
      summary: Ingest a scam report
      parameters:
        - { name: caseId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComplaintInput" }
      responses:
        "200":
          description: Updated case
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseDetail" }
  /fund-flow/{caseId}:
    get:
      operationId: getFundFlow
      tags: [cashnet]
      summary: Get unified fund-flow graph and timeline
      parameters:
        - { name: caseId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Graph
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FundFlow" }
  /wallets:
    get:
      operationId: listWallets
      tags: [cashnet]
      summary: List wallet intelligence
      responses:
        "200":
          description: Wallets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Wallet" }
  /predictions/{caseId}:
    get:
      operationId: getPredictions
      tags: [cashnet]
      summary: Get predictive cash-out hotspots
      parameters:
        - { name: caseId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Predictions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PredictionResult" }
  /interventions/{caseId}:
    get:
      operationId: getIntervention
      tags: [cashnet]
      summary: Get intervention request
      parameters:
        - { name: caseId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Intervention
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Intervention" }
    post:
      operationId: createIntervention
      tags: [cashnet]
      summary: Prepare an evidence-backed intervention request
      parameters:
        - { name: caseId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InterventionInput" }
      responses:
        "201":
          description: Draft intervention
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Intervention" }
  /interventions/{caseId}/approve:
    post:
      operationId: approveIntervention
      tags: [cashnet]
      summary: Explicitly approve an intervention draft
      parameters:
        - { name: caseId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Approved intervention
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Intervention" }
  /reports/{caseId}:
    get:
      operationId: getReport
      tags: [cashnet]
      summary: Generate investigation report data
      parameters:
        - { name: caseId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
  /v1/cases:
    get:
      operationId: listPersistentCases
      tags: [cashnet]
      summary: List cases accessible to the authenticated development actor
      responses: { "200": { description: Cases, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/PersistentCase" } } } } } }
    post:
      operationId: createPersistentCase
      tags: [cashnet]
      summary: Create a persistent case
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PersistentCaseInput" } } } }
      responses: { "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/PersistentCase" } } } } }
  /v1/cases/{id}:
    get:
      operationId: getPersistentCase
      tags: [cashnet]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Case, content: { application/json: { schema: { $ref: "#/components/schemas/PersistentCase" } } } } }
    patch:
      operationId: updatePersistentCase
      tags: [cashnet]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PersistentCasePatch" } } } }
      responses: { "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/PersistentCase" } } } } }
  /v1/cases/{id}/audit:
    get:
      operationId: listCaseAuditEvents
      tags: [cashnet]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Audit events, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } } } } } }
  /v1/investigations:
    post:
      operationId: createPersistentInvestigation
      tags: [cashnet]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/InvestigationInput" } } } }
      responses: { "201": { description: Created; collection requires approval and authorization, content: { application/json: { schema: { $ref: "#/components/schemas/PersistentInvestigation" } } } } }
  /v1/investigations/wallet:
    post:
      operationId: createWalletSubjectInvestigation
      tags: [cashnet]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/WalletInvestigationInput" } } } }
      responses: { "201": { description: Created; collection requires approval and authorization, content: { application/json: { schema: { $ref: "#/components/schemas/WalletInvestigationResult" } } } } }
  /v1/investigations/{id}:
    get:
      operationId: getPersistentInvestigation
      tags: [cashnet]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Investigation, content: { application/json: { schema: { $ref: "#/components/schemas/PersistentInvestigation" } } } } }
    patch:
      operationId: transitionPersistentInvestigation
      tags: [cashnet]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/InvestigationTransitionInput" } } } }
      responses: { "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/PersistentInvestigation" } } } } }
  /v1/investigations/{id}/collect:
    post:
      operationId: collectInvestigationProviderData
      tags: [cashnet]
      summary: Collect authorized live blockchain facts and persist normalized results
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Collection result, content: { application/json: { schema: { $ref: "#/components/schemas/CollectionResult" } } } } }
  /v1/investigations/{id}/risk-analysis:
    post:
      operationId: executeInvestigationRiskAnalysis
      tags: [cashnet]
      summary: Execute bounded AML/risk analysis over stored case-scoped facts
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: Persisted heuristic assessment; not a probability or proof, content: { application/json: { schema: { $ref: "#/components/schemas/RiskAnalysisRun" } } } } }
  /v1/investigations/{id}/risk-indicators:
    get:
      operationId: listInvestigationRiskIndicators
      tags: [cashnet]
      summary: List case-scoped persisted risk indicators
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }]
      responses: { "200": { description: Risk indicators, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/RiskIndicator" } } } } } }
  /v1/investigations/{id}/risk-indicators/{resourceId}:
    get:
      operationId: getInvestigationRiskIndicator
      tags: [cashnet]
      summary: Get one case-scoped risk indicator
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: resourceId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: Risk indicator, content: { application/json: { schema: { $ref: "#/components/schemas/RiskIndicator" } } } } }
  /v1/investigations/{id}/graph-features:
    post:
      operationId: computeInvestigationGraphFeatures
      tags: [cashnet]
      summary: Compute bounded graph features from stored relationships
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: false, content: { application/json: { schema: { $ref: "#/components/schemas/GraphFeatureRunInput" } } } }
      responses: { "200": { description: Persisted graph features, content: { application/json: { schema: { $ref: "#/components/schemas/GraphFeatureRun" } } } } }
  /v1/investigations/{id}/communities:
    post:
      operationId: detectInvestigationCommunities
      tags: [cashnet]
      summary: Run bounded structural community detection over stored relationships
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: false, content: { application/json: { schema: { $ref: "#/components/schemas/CommunityRunInput" } } } }
      responses: { "200": { description: Persisted structural communities; not ownership attribution, content: { application/json: { schema: { $ref: "#/components/schemas/CommunityRun" } } } } }
  /v1/investigations/{id}/defi-mev-analysis:
    post:
      operationId: analyzeInvestigationDefiMev
      tags: [cashnet]
      summary: Run historical DeFi and MEV-candidate analysis over stored facts
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: Historical candidates only; not real-time mempool monitoring or proof, content: { application/json: { schema: { $ref: "#/components/schemas/DefiMevAnalysis" } } } } }
  /v1/investigations/{id}/reports:
    post:
      operationId: generateInvestigationForensicReport
      tags: [cashnet]
      summary: Generate and persist a case-scoped forensic report
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: false, content: { application/json: { schema: { $ref: "#/components/schemas/ForensicReportInput" } } } }
      responses: { "201": { description: Persisted report, content: { application/json: { schema: { $ref: "#/components/schemas/ForensicReport" } } } } }
  /v1/investigations/{id}/reports/{resourceId}:
    get:
      operationId: getInvestigationForensicReport
      tags: [cashnet]
      summary: Read one case-scoped persisted forensic report
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: resourceId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: Report, content: { application/json: { schema: { $ref: "#/components/schemas/ForensicReport" } } } } }
  /v1/investigations/{id}/graph:
    get:
      operationId: traceInvestigationGraph
      tags: [cashnet]
      summary: Trace stored blockchain relationships with bounded BFS
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: depth, in: query, schema: { type: integer, minimum: 1, maximum: 5, default: 2 } }
        - { name: direction, in: query, schema: { type: string, enum: [OUTGOING, INCOMING, BOTH], default: OUTGOING } }
        - { name: max_neighbors, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: max_nodes, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 250 } }
        - { name: max_edges, in: query, schema: { type: integer, minimum: 1, maximum: 2000, default: 500 } }
        - { name: min_amount, in: query, schema: { type: string, pattern: '^\\d+(\\.\\d+)?$' } }
        - { name: max_amount, in: query, schema: { type: string, pattern: '^\\d+(\\.\\d+)?$' } }
        - { name: asset, in: query, schema: { type: string } }
        - { name: start_time, in: query, schema: { type: string, format: date-time } }
        - { name: end_time, in: query, schema: { type: string, format: date-time } }
      responses: { "200": { description: Evidence-backed graph from stored normalized facts, content: { application/json: { schema: { $ref: "#/components/schemas/InvestigationGraph" } } } } }
  /v1/investigations/{id}/address-intelligence/{chain}/{address}:
    get:
      operationId: lookupInvestigationAddressIntelligence
      tags: [cashnet]
      summary: Look up approved, case-scoped address intelligence observations
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: chain, in: path, required: true, schema: { type: string, enum: [BITCOIN, ETHEREUM, TRON] } }
        - { name: address, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: Observations and explicit conflicts; never an identity claim, content: { application/json: { schema: { $ref: "#/components/schemas/AddressIntelligenceLookup" } } } } }
  /v1/investigations/{id}/clusters:
    post:
      operationId: analyzeInvestigationBitcoinClusters
      tags: [cashnet]
      summary: Run bounded, explainable Bitcoin cluster inference over stored facts
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: false, content: { application/json: { schema: { $ref: "#/components/schemas/ClusterRunInput" } } } }
      responses: { "200": { description: Review-required inferences, content: { application/json: { schema: { $ref: "#/components/schemas/ClusterRunResult" } } } } }
    get:
      operationId: listInvestigationClusters
      tags: [cashnet]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }]
      responses: { "200": { description: Stored review-required cluster inferences, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ClusterInference" } } } } } }
  /v1/investigations/{id}/vasp-analysis:
    post:
      operationId: analyzeInvestigationVaspCandidates
      tags: [cashnet]
      summary: Run deterministic evidence fusion for service and VASP candidates
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: false, content: { application/json: { schema: { $ref: "#/components/schemas/VaspAnalysisInput" } } } }
      responses: { "200": { description: "Investigative candidates, not person attribution", content: { application/json: { schema: { $ref: "#/components/schemas/VaspAnalysisResult" } } } } }
  /v1/investigations/{id}/vasp-candidates:
    get:
      operationId: listInvestigationVaspCandidates
      tags: [cashnet]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }]
      responses: { "200": { description: Persisted candidate records with traceable evidence, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/VaspCandidate" } } } } } }
  /v1/investigations/{id}/vasp-candidates/{candidateId}/review:
    post:
      operationId: reviewInvestigationVaspCandidate
      tags: [cashnet]
      summary: Record a human review of a VASP candidate
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: candidateId, in: path, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AttributionReviewInput" } } } }
      responses: { "201": { description: Append-only review record, content: { application/json: { schema: { $ref: "#/components/schemas/AttributionReview" } } } } }
  /v1/wallets/{chain}/{address}:
    get:
      operationId: getLiveWalletProfile
      tags: [cashnet]
      summary: Read normalized wallet facts through an authorized provider adapter
      parameters:
        - { name: chain, in: path, required: true, schema: { type: string, enum: [BITCOIN, ETHEREUM, TRON, BNB_CHAIN, POLYGON, SOLANA, OTHER] } }
        - { name: address, in: path, required: true, schema: { type: string } }
        - { name: investigation_id, in: query, required: true, schema: { type: string, format: uuid }, description: Authorized investigation scope; a valid actor alone is insufficient. }
      responses: { "200": { description: Normalized provider result, content: { application/json: { schema: { $ref: "#/components/schemas/LiveWalletResult" } } } } }
  /v1/transactions/{chain}/{txHash}:
    get:
      operationId: getLiveTransaction
      tags: [cashnet]
      summary: Read one normalized transaction through an authorized provider adapter
      parameters:
        - { name: chain, in: path, required: true, schema: { type: string, enum: [BITCOIN, ETHEREUM, TRON, BNB_CHAIN, POLYGON, SOLANA, OTHER] } }
        - { name: txHash, in: path, required: true, schema: { type: string } }
        - { name: investigation_id, in: query, required: true, schema: { type: string, format: uuid }, description: Authorized investigation scope; a valid actor alone is insufficient. }
      responses: { "200": { description: Normalized transaction, content: { application/json: { schema: { $ref: "#/components/schemas/NormalizedTransactionBundle" } } } } }
  /v1/evidence:
    post:
      operationId: createPersistentEvidence
      tags: [cashnet]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/EvidenceInput" } } } }
      responses: { "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/PersistentEvidence" } } } } }
  /v1/evidence/{id}:
    get:
      operationId: getPersistentEvidence
      tags: [cashnet]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Evidence, content: { application/json: { schema: { $ref: "#/components/schemas/PersistentEvidence" } } } } }
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Case:
      type: object
      required: [id, reference, title, fraudType, amount, priority, status, state, city, conversionAt]
      properties:
        id: { type: string }
        reference: { type: string }
        title: { type: string }
        fraudType: { type: string }
        amount: { type: number }
        priority: { type: string }
        status: { type: string }
        state: { type: string }
        city: { type: string }
        conversionAt: { type: string }
        sourceType: { type: string }
        updatedAt: { type: string }
    CaseInput:
      type: object
      required: [title, fraudType, amount, description]
      properties:
        title: { type: string, minLength: 3 }
        fraudType: { type: string }
        amount: { type: number, minimum: 1 }
        description: { type: string, minLength: 10 }
        victimCity: { type: string }
        victimState: { type: string }
        account: { type: string }
        wallet: { type: string }
    ComplaintInput:
      type: object
      required: [description]
      properties:
        description: { type: string, minLength: 10 }
        transactionIds: { type: array, items: { type: string } }
        accounts: { type: array, items: { type: string } }
        upiIds: { type: array, items: { type: string } }
        wallets: { type: array, items: { type: string } }
        incidentDate: { type: string }
        location: { type: string }
    CaseDetail:
      allOf:
        - $ref: "#/components/schemas/Case"
        - type: object
          required: [complaint, accounts, transactions, fundFlow, wallets, vasp, risk, predictions, recommendations, lastCredited, intervention, audit]
          properties:
            complaint: { $ref: "#/components/schemas/Complaint" }
            accounts: { type: array, items: { $ref: "#/components/schemas/Account" } }
            transactions: { type: array, items: { $ref: "#/components/schemas/Transaction" } }
            fundFlow: { $ref: "#/components/schemas/FundFlow" }
            wallets: { type: array, items: { $ref: "#/components/schemas/Wallet" } }
            vasp: { type: array, items: { $ref: "#/components/schemas/Vasp" } }
            risk: { $ref: "#/components/schemas/Risk" }
            predictions: { $ref: "#/components/schemas/PredictionResult" }
            recommendations: { type: array, items: { $ref: "#/components/schemas/Recommendation" } }
            lastCredited: { $ref: "#/components/schemas/LastCredited" }
            intervention: { $ref: "#/components/schemas/Intervention" }
            audit: { type: array, items: { $ref: "#/components/schemas/Audit" } }
    Complaint:
      type: object
      required: [description, indicators]
      properties:
        description: { type: string }
        indicators: { type: array, items: { type: string } }
        sourceType: { type: string }
        receivedAt: { type: string }
    Account:
      type: object
      required: [id, masked, bank, ifsc, branch, risk, inflow, outflow, transactions, indicators]
      properties:
        id: { type: string }
        masked: { type: string }
        bank: { type: string }
        ifsc: { type: string }
        branch: { type: string }
        district: { type: string }
        state: { type: string }
        risk: { type: number }
        inflow: { type: number }
        outflow: { type: number }
        transactions: { type: number }
        indicators: { type: array, items: { type: string } }
    Transaction:
      type: object
      required: [id, timestamp, source, destination, amount, currency, type, risk, confidence]
      properties:
        id: { type: string }
        timestamp: { type: string }
        source: { type: string }
        destination: { type: string }
        amount: { type: number }
        currency: { type: string }
        type: { type: string }
        risk: { type: number }
        confidence: { type: number }
        chain: { type: ["string", "null"] }
        isConversion: { type: boolean }
    GraphNode:
      type: object
      required: [id, label, kind, risk, x, y]
      properties:
        id: { type: string }
        label: { type: string }
        kind: { type: string }
        risk: { type: number }
        x: { type: number }
        y: { type: number }
    GraphEdge:
      type: object
      required: [id, source, target, amount, timestamp, label, risk]
      properties:
        id: { type: string }
        source: { type: string }
        target: { type: string }
        amount: { type: number }
        timestamp: { type: string }
        label: { type: string }
        risk: { type: number }
        conversion: { type: boolean }
    FundFlow:
      type: object
      required: [nodes, edges, timeline, metrics]
      properties:
        nodes: { type: array, items: { $ref: "#/components/schemas/GraphNode" } }
        edges: { type: array, items: { $ref: "#/components/schemas/GraphEdge" } }
