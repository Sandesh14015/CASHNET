name: Security Dependency Scan

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "**/package.json"
      - "**/package-lock.json"
      - ".github/workflows/dependency-scan.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "**/package.json"
      - "**/package-lock.json"
  schedule:
    # Run daily at 2 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  npm-audit:
    name: NPM Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        id: npm-audit
        continue-on-error: true
        run: npm audit --audit-level=moderate

      - name: Generate SARIF report
        if: always()
        run: |
          npm audit --json > audit-report.json || true
          npm audit --json --production > audit-report-prod.json || true

      - name: Convert audit to SARIF
        if: always()
        run: |
          npm install -g npm-audit-to-sarif
          npm-audit-to-sarif audit-report.json --output audit.sarif || true

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: audit.sarif
          category: npm-audit

      - name: Comment on PR with audit results
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const audit = JSON.parse(fs.readFileSync('audit-report.json', 'utf-8'));
            
            let comment = '## ⚠️ NPM Security Audit Results\n\n';
            comment += `Vulnerabilities Found: **${audit.metadata.vulnerabilities.total}**\n`;
            comment += `- 🔴 Critical: ${audit.metadata.vulnerabilities.critical || 0}\n`;
            comment += `- 🟠 High: ${audit.metadata.vulnerabilities.high || 0}\n`;
            comment += `- 🟡 Medium: ${audit.metadata.vulnerabilities.moderate || 0}\n`;
            comment += `- 🔵 Low: ${audit.metadata.vulnerabilities.low || 0}\n\n`;
            
            if (audit.vulnerabilities) {
              comment += '### Vulnerable Packages\n\n';
              for (const [pkg, info] of Object.entries(audit.vulnerabilities)) {
                comment += `- **${pkg}**: ${info.vulnerabilities?.length || 0} vulnerabilities\n`;
              }
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Fail if critical vulnerabilities found
        if: steps.npm-audit.outcome == 'failure'
        run: |
          echo "🚨 Security vulnerabilities found in dependencies"
          exit 1

  snyk-scan:
    name: Snyk Dependency Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Snyk scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --json --file=package.json --severity-threshold=high
        continue-on-error: true

  license-check:
    name: License Compliance Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install license-report tool
        run: npm install -g license-report

      - name: Check licenses
        id: license-check
        continue-on-error: true
        run: |
          license-report --only=prod --output=json > licenses.json
          license-report --output=csv > licenses.csv

      - name: Review restricted licenses
        run: |
          echo "Checking for problematic licenses..."
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('licenses.json', 'utf-8'));
            const restricted = ['GPL', 'AGPL', 'SSPL'];
            const issues = data.filter(p => 
              restricted.some(l => p.licenses?.includes(l))
            );
            if (issues.length > 0) {
              console.log('⚠️ Restricted licenses found:');
              issues.forEach(p => console.log('  -', p.name, ':', p.licenses));
              process.exit(1);
            }
          "

      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: license-report
          path: licenses.*

  dependency-report:
    name: Generate Dependency Report
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Generate dependency tree
        run: |
          npm ls --depth=0 > dependency-tree.txt 2>&1 || true
          npm outdated > outdated.txt 2>&1 || true

      - name: Upload reports
        uses: actions/upload-artifact@v3
        with:
          name: dependency-reports
          path: |
            dependency-tree.txt
            outdated.txt

      - name: Create issue if updates available
        if: failure() && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const outdated = fs.readFileSync('outdated.txt', 'utf-8');
            
            if (outdated.trim().length > 0 && !outdated.includes('npm ERR')) {
              github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🔄 Dependencies available for update',
                body: '```\n' + outdated + '\n```',
                labels: ['dependencies', 'maintenance']
              });
            }
