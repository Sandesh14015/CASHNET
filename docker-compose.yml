# CASHNET — Supabase-backed Docker Compose
# DATABASE_URL and CASHNET_MIGRATION_DATABASE_URL are injected by the
# deployment secret manager. This stack intentionally contains no database
# service, local database volume, or localhost fallback.

services:
  # Use the same ledger-backed migration runner used by local development and
  # CI. It is a bounded one-shot job; the API never starts against an
  # uninitialised Supabase schema.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: ["sh", "-c", "pnpm --filter @workspace/db run provision-application-role && pnpm --filter @workspace/db run migrate"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL through the deployment secret manager}
      CASHNET_MIGRATION_DATABASE_URL: ${CASHNET_MIGRATION_DATABASE_URL:?Set CASHNET_MIGRATION_DATABASE_URL through the deployment secret manager}
      CASHNET_SUPABASE_CA_CERT_PATH: /run/secrets/cashnet_supabase_ca.pem
    secrets:
      - source: cashnet_supabase_ca
        target: cashnet_supabase_ca.pem
        mode: 0444
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL through the deployment secret manager}
      CASHNET_SUPABASE_CA_CERT_PATH: /run/secrets/cashnet_supabase_ca.pem
      PORT: "3000"
      CASHNET_DATA_MODE: authorized
      # The image runs with NODE_ENV=production. Keep the development actor
      # header disabled explicitly as a defence-in-depth deployment control.
      CASHNET_DEV_AUTH_ENABLED: "false"
      CASHNET_PROVIDER_TIMEOUT_MS: "10000"
      CASHNET_PROVIDER_MAX_RETRIES: "2"
      # Provider API keys — set only through the deployment secret manager.
      ETHERSCAN_API_KEY: ${ETHERSCAN_API_KEY:-}
      TRONGRID_API_KEY: ${TRONGRID_API_KEY:-}
      BSCSCAN_API_KEY: ${BSCSCAN_API_KEY:-}
      POLYGONSCAN_API_KEY: ${POLYGONSCAN_API_KEY:-}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-}
      SOLANA_API_KEY: ${SOLANA_API_KEY:-}
    secrets:
      - source: cashnet_supabase_ca
        target: cashnet_supabase_ca.pem
        mode: 0444
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/readyz"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3

secrets:
  cashnet_supabase_ca:
    file: ${CASHNET_SUPABASE_CA_CERT_PATH:?Set CASHNET_SUPABASE_CA_CERT_PATH to the Supabase CA PEM through the deployment secret manager}

