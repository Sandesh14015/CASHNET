# ============================================================================
# CashNet Prometheus Alert Rules
# ============================================================================

groups:
  # ============================================================================
  # API Alerts
  # ============================================================================
  - name: cashnet-api
    rules:
      # High error rate
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High API error rate detected"
          description: "Error rate is {{ $value }} errors per second"
      
      # High latency
      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API latency detected"
          description: "95th percentile latency is {{ $value }} seconds"
      
      # Service down
      - alert: ServiceDown
        expr: up{job="cashnet-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "CashNet API service is down"
          description: "Service has been down for more than 1 minute"
      
      # High memory usage
      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes / 1024 / 1024 > 512
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is {{ $value }} MB"
  
  # ============================================================================
  # Database Alerts
  # ============================================================================
  - name: cashnet-database
    rules:
      # Database connection pool exhausted
      - alert: DatabaseConnectionPoolExhausted
        expr: pg_stat_activity_count > 50
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Database connection pool exhausted"
          description: "Active connections: {{ $value }}"
      
      # Database replication lag
      - alert: DatabaseReplicationLag
        expr: pg_replication_lag > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Database replication lag detected"
          description: "Replication lag is {{ $value }} seconds"
      
      # Database disk space
      - alert: DatabaseDiskSpaceLow
        expr: (pg_database_size_bytes / 1024 / 1024 / 1024) > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Database disk space is running low"
          description: "Database size is {{ $value }} GB"
  
  # ============================================================================
  # Redis Alerts
  # ============================================================================
  - name: cashnet-redis
    rules:
      # Redis memory usage
      - alert: RedisMemoryUsage
        expr: redis_memory_used_bytes / 1024 / 1024 > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage is high"
          description: "Memory usage is {{ $value }} MB"
      
      # Redis connection refused
      - alert: RedisConnectionRefused
        expr: redis_connected_clients == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis connection refused"
          description: "No connected clients"
  
  # ============================================================================
  # ML Model Alerts
  # ============================================================================
  - name: cashnet-ml
    rules:
      # Model prediction latency
      - alert: ModelPredictionLatencyHigh
        expr: histogram_quantile(0.95, rate(model_prediction_duration_seconds_bucket[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Model prediction latency is high"
          description: "95th percentile latency is {{ $value }} seconds"
      
      # Model accuracy drop
      - alert: ModelAccuracyDrop
        expr: model_accuracy < 0.8
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Model accuracy has dropped"
          description: "Current accuracy: {{ $value }}"
      
      # Model drift detected
      - alert: ModelDriftDetected
        expr: model_drift_score > 0.1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Model drift detected"
          description: "Drift score: {{ $value }}"
  
  # ============================================================================
  # Security Alerts
  # ============================================================================
  - name: cashnet-security
    rules:
      # Failed login attempts
      - alert: FailedLoginAttempts
        expr: rate(auth_failed_logins_total[5m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High number of failed login attempts"
          description: "Failed login rate: {{ $value }} per second"
      
      # Unauthorized access attempts
      - alert: UnauthorizedAccessAttempts
        expr: rate(auth_unauthorized_access_total[5m]) > 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High number of unauthorized access attempts"
          description: "Unauthorized access rate: {{ $value }} per second"
      
      # Rate limit exceeded
      - alert: RateLimitExceeded
        expr: rate(rate_limit_exceeded_total[5m]) > 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Rate limit is being exceeded frequently"
          description: "Rate limit exceeded: {{ $value }} per second"
