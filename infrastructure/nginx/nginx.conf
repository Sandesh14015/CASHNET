# ============================================================================
# CashNet Nginx Configuration
# ============================================================================

worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    # ============================================================================
    # Basic Settings
    # ============================================================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;
    
    # MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # ============================================================================
    # Logging
    # ============================================================================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;
    
    # ============================================================================
    # Gzip Compression
    # ============================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript 
               text/xml application/xml application/xml+rss text/javascript;
    
    # ============================================================================
    # Rate Limiting
    # ============================================================================
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    
    # ============================================================================
    # Upstream Servers
    # ============================================================================
    upstream cashnet_api {
        least_conn;
        server api:8000;
        keepalive 32;
    }
    
    upstream cashnet_geospatial {
        least_conn;
        server geospatial:8000;
        keepalive 16;
    }
    
    # ============================================================================
    # HTTP Server (Redirect to HTTPS)
    # ============================================================================
    server {
        listen 80;
        server_name cashnet.gov.in;
        
        # Allow Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        
        # Redirect all other traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }
    
    # ============================================================================
    # HTTPS Server
    # ============================================================================
    server {
        listen 443 ssl http2;
        server_name cashnet.gov.in;
        
        # SSL Configuration
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        
        # HSTS
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        
        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:;" always;
        
        # Client Max Body Size
        client_max_body_size 10M;
        
        # ============================================================================
        # API Routes
        # ============================================================================
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            
            proxy_pass http://cashnet_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeout settings
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
        
        # ============================================================================
        # Authentication Routes (Stricter Rate Limiting)
        # ============================================================================
        location /auth/ {
            limit_req zone=auth burst=5 nodelay;
            
            proxy_pass http://cashnet_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # ============================================================================
        # Geospatial Service Routes
        # ============================================================================
        location /geospatial/ {
            limit_req zone=api burst=10 nodelay;
            
            proxy_pass http://cashnet_geospatial;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # ============================================================================
        # Health Check Endpoints
        # ============================================================================
        location /health {
            proxy_pass http://cashnet_api;
            proxy_set_header Host $host;
        }
        
        location /ready {
            proxy_pass http://cashnet_api;
            proxy_set_header Host $host;
        }
        
        # ============================================================================
        # Static Files (if any)
        # ============================================================================
        location /static/ {
            alias /var/www/cashnet/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
        
        # ============================================================================
        # Default Route
        # ============================================================================
        location / {
            return 404;
        }
        
        # ============================================================================
        # Error Pages
        # ============================================================================
        error_page 404 /404.html;
        location = /404.html {
            root /var/www/cashnet/errors;
            internal;
        }
        
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /var/www/cashnet/errors;
            internal;
        }
    }
}
